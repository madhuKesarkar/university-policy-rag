[pytest]
testpaths = tests
pythonpath = .
markers =
    unit: fast deterministic tests, no network, no LLM
    integration: talks to a running app or database
    eval: LLM-judged quality metrics
    e2e: full user journeys
    nfr: latency, cost, load
    adversarial: prompt injection, jailbreaks, data leaks
addopts = -ra --strict-markers